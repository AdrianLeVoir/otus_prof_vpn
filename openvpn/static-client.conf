# static-key туннель, клиент (vpnclient), tun-режим
# файл: /etc/openvpn/static-server.conf ; запуск: systemctl start openvpn@static-server
dev tun
local 10.0.0.2
remote 10.0.0.1
ifconfig 10.10.10.2 10.10.10.1
secret /etc/openvpn/static.key
cipher AES-256-CBC
status /var/log/openvpn-status.log
log /var/log/openvpn.log
verb 3