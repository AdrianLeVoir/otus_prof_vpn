# OpenConnect-сервер (vpnserver)
# файл: /etc/ocserv/ocserv.conf ; запуск: systemctl start ocserv
listen-host = 0.0.0.0
tcp-port = 8443
udp-port = 8443
server-cert = /etc/openvpn/pki/issued/server.crt
server-key = /etc/openvpn/pki/private/server.key
ca-cert = /etc/openvpn/pki/ca.crt
device = vpns
auth = "plain[passwd=/etc/ocserv/ocpasswd]"
max-clients = 8
run-as-user = nobody
run-as-group = nogroup
socket-file = /run/ocserv.socket
ipv4-network = 10.11.11.0/24
ipv4-netmask = 255.255.255.0
dns = 8.8.8.8