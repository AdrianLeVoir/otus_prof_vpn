# tap-вариант static-key туннеля (замер скоростей).
# Отличия от tun-версии: dev tap, ifconfig задаёт маску вместо peer.
# Заменить на сервере и клиенте:
#   dev tap
#   ifconfig 10.10.10.1 255.255.255.0     # сервер
#   ifconfig 10.10.10.2 255.255.255.0     # клиент
dev tap
local 10.0.0.1
remote 10.0.0.2
ifconfig 10.10.10.1 255.255.255.0
secret /etc/openvpn/static.key
cipher AES-256-CBC
status /var/log/openvpn-status.log
log /var/log/openvpn.log
verb 3